# ============================================================
# 电炉上位机 - DB36 furnace_conf_persist 配置
# 配置文件: 电炉持久化配置数据块
# 适用场景: 高压紧急停电弧流上限、消抖时间、功能使能
# ============================================================
# 注意: 该数据块为 PLC 保持型数据块 (掉电不丢失)
# 从 DB1 offset 182-189 迁移而来
# ============================================================

db36_furnace_conf:
  db_block: 36
  name: "furnace_conf_persist"
  total_size: 8  # offset 0 ~ 7

  # 字段定义列表 (按偏移量顺序)
  fields:
    # ============================================================
    # 高压紧急停电配置 (offset 0-7, 共8字节)
    # ============================================================
    - name: emergency_stop_arc_limit
      offset: 0
      type: INT
      unit: "A"
      description: 高压紧急停电弧流上限值
      writable: true

    - name: emergency_stop_delay
      offset: 2
      type: TIME
      unit: "ms"
      description: 高压紧急停电消抖时间 (PLC存储为毫秒, 32位有符号整数)
      writable: true

    - name: emergency_stop_enabled
      offset: 6
      type: BOOL
      unit: ""
      description: 高压紧急停电功能使能 (独占2字节)
      writable: false
